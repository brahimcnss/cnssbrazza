apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-backend-dev
  labels:
    app: admin-backend-dev
    type: backend
spec:
  selector:
    matchLabels:
      app: admin-backend-dev
      type: backend
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: admin-backend-dev
        type: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: workernode1
      imagePullSecrets:
        - name: regcred      
      containers:
        - name: admin-backend-dev
          image: 192.168.2.19:5000/administration2:0.0.1-SNAPSHOT
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "2Gi"
              cpu: "3"
              #---------------------------------#
          ports:
            - name: api
              containerPort: 11994
              protocol: TCP
          imagePullPolicy: Always      
 
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1800m"
            - name: ORACLEHOSTADMIN2
              valueFrom:
                configMapKeyRef:
                  name: oracle-config-admin-dev
                  key: default.oracle-instance-host-admin-dev
            - name: ORACLEPORTADMIN2
              valueFrom:
                configMapKeyRef:
                  name: oracle-config-admin-dev
                  key: default.oracle-instance-port-admin-dev
            - name: ORACLEUSERADMIN2
              valueFrom:
                configMapKeyRef:
                  name: oracle-config-admin-dev
                  key: default.oracle-instance-user-admin-dev
            - name: ORACLEPASSWORDADMIN2
              valueFrom:
                secretKeyRef:
                  name: oracle-instance-password-admin-dev
                  key: password
            
     
      
