# ===========================================
# 1️⃣ Namespace
# ===========================================
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ===========================================
# 2️⃣ Node Exporter DaemonSet + Service
# ===========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.5.0
          ports:
            - containerPort: 9100
              name: metrics
          securityContext:
            privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  clusterIP: None
---
# ===========================================
# 3️⃣ kube-state-metrics Deployment + Service
# ===========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      containers:
        - name: kube-state-metrics
          image: quay.io/prometheus/kube-state-metrics:v2.9.8
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector:
    app: kube-state-metrics
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# ===========================================
# 4️⃣ Prometheus ConfigMap
# ===========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: node-exporter
            action: keep
          
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']
      - job_name: 'microservices-default'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - '192.168.2.37:32104'
              - '192.168.2.37:32105'
              - '192.168.2.37:32110'
    rule_files:
      - /etc/prometheus/alerts.rules
---
# ===========================================
# 5️⃣ Prometheus alert rules
# ===========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
data:
  alerts.rules: |
    groups:
    - name: pod-alerts
      rules:
      - alert: HighCpuUsage
        expr: sum(rate(container_cpu_usage_seconds_total{pod=~".*"}[2m])) by (pod) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} utilise trop de CPU"
          description: "CPU > 80% depuis 2 minutes"
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{pod=~".*"} > 500*1024*1024
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} utilise trop de RAM"
          description: "RAM > 500MB depuis 2 minutes"
      - alert: PodDown
        expr: kube_pod_status_phase{phase="Running"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} est DOWN"
          description: "Le pod {{ $labels.pod }} n'est plus Running depuis 1 minute"
      - alert: AlwaysFiring
        expr: vector(1)
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Alerte de test (AlwaysFiring)"
          description: "Cette alerte est toujours déclenchée pour tester la chaîne Prometheus → Alertmanager → Email"
---
# ===========================================
# 6️⃣ Prometheus Deployment + Service
# ===========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-alert-rules
              mountPath: /etc/prometheus/alerts.rules
              subPath: alerts.rules
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-alert-rules
          configMap:
            name: prometheus-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
# ===========================================
# 7️⃣ Alertmanager ConfigMap
# ===========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'ibrabrims@gmail.com'
      smtp_auth_username: 'ibrabrims@gmail.com'
      smtp_auth_password: 'TON_MOT_DE_PASSE_APP'
    route:
      receiver: 'email-alert'
      group_interval: 5m
      repeat_interval: 10m
    receivers:
      - name: 'email-alert'
        email_configs:
          - to: 'ibrabrims@gmail.com'
            send_resolved: true
---
# ===========================================
# 8️⃣ Alertmanager Deployment + Service
# ===========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.25.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
---
# ===========================================
# 9️⃣ Grafana Deployment + Service
# ===========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.0.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300
