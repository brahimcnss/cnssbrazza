apiVersion: apps/v1
kind: Deployment
metadata:
  name: ged-backend
  labels:
    app: ged-backend
    type: backend
spec:
  selector:
    matchLabels:
      app: ged-backend
      type: backend
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ged-backend
        type: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: workernode1
      imagePullSecrets:
       - name: regcred
      containers:
        - name: ged-backend
          image: 192.168.2.19:5000/intgederp:0.0.1-SNAPSHOT
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "2"
           
              #---------------------------------#
          ports:
            - name: api
              containerPort: 7071
              protocol: TCP
          imagePullPolicy: Always
          